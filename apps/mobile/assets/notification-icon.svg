<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- PLACEHOLDER Android status-bar notification icon (plan Q5). Android uses only the alpha channel
       (white on transparent) and tints it with expo-notifications `color` (#9A4A12, light accent).
       Loaf only (no board) so it stays legible at 24 dp; score cut out with a mask. -->
  <title>Sourdough Assistant</title>
  <defs>
    <mask id="score-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#FFFFFF"/>
      <path fill="none" stroke="#000000" stroke-width="48" stroke-linecap="round" d="M360 560 C424 456 540 410 660 432"/>
    </mask>
  </defs>
  <g transform="translate(48 48) scale(0.135) translate(-512 -506)">
    <path fill="#FFFFFF" mask="url(#score-cut)" d="M262 712 C232 712 222 694 224 668 C238 462 366 300 512 300 C658 300 786 462 800 668 C802 694 792 712 762 712 Z"/>
  </g>
</svg>
